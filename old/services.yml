---
- name: Enable systemd services
  become: yes
  systemd:
    name: "{{ item.value.name }}"
    enabled: yes
    state: started
  with_dict: "{{ services }}"

- name: Enable systemd user services
  become: yes
  become_user: "{{ username }}"
  systemd:
    name: "{{ item.value.name }}"
    scope: user
    enabled: yes
    state: started
  with_dict: "{{ user_services }}"

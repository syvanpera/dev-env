---
- include_vars: vars.yml
- include_tasks: "{{ item }}"
  with_first_found:
    - files:
      - "{{ distro }}/customizations.yml"
      skip: true
- name: Add caps2esc udevmon intercept
  become: yes
  copy:
    dest: "/etc/interception/udevmon.yaml"
    content: |
      - JOB: "intercept -g $DEVNODE | caps2esc -m 1 | uinput -d $DEVNODE"
        DEVICE:
          EVENTS:
            EV_KEY: [KEY_CAPSLOCK, KEY_ESC]
- name: Enable Wayland in Firefox (needed for gestures)
  become: yes
  become_user: "{{ username }}"
  block:
    - file:
        path: "{{ home }}/.config/environment.d"
        state: directory
    - copy:
        dest: "{{ home }}/.config/environment.d/envvars.conf"
        content: |
          MOZ_ENABLE_WAYLAND=1



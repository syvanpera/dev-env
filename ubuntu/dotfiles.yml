- block:
    - name: Check if dotfiles are already checked out
      stat:
        path: "{{ user.home }}/.dotfiles"
      register: dotfiles_status
      ignore_errors: yes
    - name: Clone dotfiles repo
      when: not dotfiles_status.stat.exists
      git:
        repo: "{{ dotfiles_repo_url }}"
        dest: "{{ user.home }}/.dotfiles"
        clone: true
        depth: 1
        version: "main"
    - name: Run stow
      shell: "stow . --dir {{ user.home }}/.dotfiles --target {{ user.home }} --verbose=2"
      register: result
      changed_when: '"LINK" in result.stderr'
    - name: Initialize & install Neovim plugins
      shell: "nvim --headless \"+Lazy! sync\" +qa"
    - name: Add custom configs to .gitconfig
      blockinfile:
        path: "{{ user.home }}/.gitconfig"
        block: |
          [includeIf "gitdir:~/project"]
            path = .gitconfig-asteroid

  become: yes
  become_user: "{{ user.name }}"

# - include_vars: ../vars.yml
# - name: Check for existing dotfiles repo
#   stat:
#     path: "{{ home }}/.dotfiles"
#   register: dotfiles_details
- block:
    - name: Clone dotfiles repo
      git:
        repo: "{{ dotfiles_repo_url }}"
        dest: "{{ user.home }}/.dotfiles"
        clone: true
        depth: 1
        version: "main"
      # when: not dotfiles_details.stat.exists
    # - name: Create .config directory
    #   file:
    #     path: "{{ user.home }}/.config"
    #     state: directory
    - name: Run stow
      shell: "stow . --dir {{ user.home }}/.dotfiles --target {{ user.home }} --verbose=2"
      register: result
      changed_when: '"LINK" in result.stderr'
    - name: Initialize & install Neovim plugins
      shell: "nvim --headless \"+Lazy! sync\" +qa"
  become: yes
  become_user: "{{ user.name }}"

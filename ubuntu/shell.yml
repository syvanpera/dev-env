- block:
    - name: Download Oh My Zsh installation script
      get_url:
        url: https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh
        dest: /tmp/install_ohmyzsh.sh

    - name: Run Oh My Zsh installation script
      command: sh /tmp/install_ohmyzsh.sh --unattended
      register: ohmyzsh_result
      failed_when: "'FAILED' in ohmyzsh_result.stderr"

    - name: Install Oh My Zsh plugins
      git:
        repo: "{{ item.repo }}"
        dest: "{{ user.home }}/.oh-my-zsh/custom/plugins/{{ item.name }}"
        depth: 1
      loop: "{{ ohmyzsh.plugins }}"

    - name: Install Oh My Zsh themes
      git:
        repo: "{{ item.repo }}"
        dest: "{{ user.home }}/.oh-my-zsh/custom/themes/{{ item.name }}"
        depth: 1
      loop: "{{ ohmyzsh.themes }}"

    - name: Add custom configs to .zshrc
      blockinfile:
        path: "{{ user.home }}/.zshrc"
        block: |
          export PATH=$HOME/.local/bin:$PATH

          source "$HOME/.atuin/bin/env"
          source <(fzf --zsh)

          alias vi="nvim"
          alias l="eza --color=always --long --group-directories-first --git --no-filesize --icons=always --no-time --no-user --no-permissions"
          alias ll="eza -l --group --color=always --group-directories-first --time-style=long-iso --icons --git"
          alias ls="eza --group --color=always --group-directories-first --time-style=long-iso --icons"

          eval "$(starship init zsh)"
          eval "$(zoxide init zsh)"
          eval "$(atuin init zsh)"

    - name: Ensure Tmux Plugin directory exists
      file:
        path: "{{ user.home }}/.tmux/plugins"
        state: directory

    - name: Install Tmux Plugin Manager
      git:
        repo: "https://github.com/tmux-plugins/tpm"
        dest: "{{ user.home }}/.tmux/plugins/tpm"
        depth: 1

    - name: Check if zoxide is installed
      stat:
        path: "{{ user.home }}/.local/bin/zoxide"
      register: zoxide_status
      ignore_errors: yes

    - name: Install zoxide
      when: not zoxide_status.stat.exists
      shell: |
        curl -sSfL https://raw.githubusercontent.com/ajeetdsouza/zoxide/main/install.sh | sh

    - name: Check if atuin is installed
      stat:
        path: "{{ user.home }}/.atuin/bin/atuin"
      register: atuin_status
      ignore_errors: yes

    - name: Install atuin
      when: not atuin_status.stat.exists
      shell: |
        curl --proto '=https' --tlsv1.2 -LsSf https://setup.atuin.sh | sh

  become: yes
  become_user: "{{ user.name }}"

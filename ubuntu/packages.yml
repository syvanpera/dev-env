- name: Install system packages
  become: yes
  package:
    state: present
    name: "{{ packages }}"

# - name: Install python packages
#   become: yes
#   become_user: "{{ user.name }}"
#   shell: pipx install {{ item }}
#   loop: "{{ python_packages }}"

- block:
    - name: Check if cargo is installed
      stat:
        path: "{{ user.home }}/.cargo/bin/cargo"
      register: cargo_status
      ignore_errors: yes

    - name: Install rust toolchain with rustup
      when: not cargo_status.stat.exists
      shell: curl https://sh.rustup.rs -sSf | sh -s -- -y

    - name: Install rust packages
      community.general.cargo:
        executable: "{{ user.home }}/.cargo/bin/cargo"
        name: "{{ rust_packages }}"

  become_user: "{{ user.name }}"
  become: yes

- name: Check if starship is installed
  stat:
    path: "/usr/local/bin/starship"
  register: starship_status
  ignore_errors: yes

- name: Install starship
  when: not starship_status.stat.exists
  shell: curl https://starship.rs/install.sh -sSf | sh -s -- -y

- name: Check if neovim is installed
  stat:
    path: "/usr/local/bin/nvim"
  register: nvim_status
  ignore_errors: yes

- name: Install neovim
  when: not nvim_status.stat.exists
  shell: |
    cd /tmp
    curl -LO https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz
    sudo tar -C /usr/local -xzf nvim-linux-x86_64.tar.gz --strip-components=1

- name: Install system packages
  become: yes
  package:
    state: present
    name: "{{ packages }}"

- name: Install python packages
  become: yes
  become_user: "{{ user.name }}"
  shell: pipx install {{ item }}
  loop: "{{ python_packages }}"

# - name: Install rust packages
#   community.general.cargo:
#     executable: "{{ user.home }}/.cargo/bin/cargo"
#     name: "{{ rust_packages }}"

- name: Check if starship is installed
  stat:
    path: "/usr/local/bin/starship"
  register: starship_status
  ignore_errors: yes

- name: Install starship
  when: not starship_status.stat.exists
  shell: curl https://starship.rs/install.sh -sSf | sh -s -- -y

- block:
    - name: Fetch latest fzf release info
      uri: url="https://api.github.com/repos/junegunn/fzf/releases/latest" return_content=yes
      register: fzf_release_json

    - name: Extract latest fzf release tarball
      unarchive:
        src: "{{ fzf_release_json.content|from_json|community.general.json_query(\"assets[?contains(browser_download_url, 'linux_amd64')].browser_download_url | [0]\") }}"
        dest: /usr/local/bin
        remote_src: yes

- block:
    - name: Fetch latest lazygit release info
      uri: url="https://api.github.com/repos/jesseduffield/lazygit/releases/latest" return_content=yes
      register: lazygit_release_json

    - name: Extract latest lazygit release tarball
      unarchive:
        src: "{{ lazygit_release_json.content|from_json|community.general.json_query(\"assets[?contains(browser_download_url, 'Linux_x86_64')].browser_download_url | [0]\") }}"
        dest: /usr/local/bin
        remote_src: yes

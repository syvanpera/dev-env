- name: Check if nix is installed
  stat:
    path: "/nix/var/nix/profiles/default/bin/nix"
  register: nix_status
  ignore_errors: yes
- name: Install nix
  when: not nix_status.stat.exists
  shell: |
    curl -L https://nixos.org/nix/install | sh -s -- --daemon
- name: Enable flakes support
  when: not nix_status.stat.exists
  lineinfile:
    path: /etc/nix/nix.conf
    line: "experimental-features = nix-command flakes"
- name: Add nix trusted users
  when: not nix_status.stat.exists
  lineinfile:
    path: /etc/nix/nix.conf
    line: "trusted-users = root {{username}}"

- block:
    - name: Check if cargo is installed
      stat:
        path: "{{ user.home }}/.cargo/bin/cargo"
      register: cargo_status
      ignore_errors: yes
    - name: Install rust toolchain with rustup
      when: not cargo_status.stat.exists
      shell: curl https://sh.rustup.rs -sSf | sh -s -- -y
    - name: Check if cargo package already exists
      stat:
        path: "{{ user.home }}/.cargo/bin/{{ item.binary }}"
      loop:  "{{ cargo_packages }}"
      register: check_cargo_status
    - name: Install rust package with cargo
      when: not item.stat.exists
      community.general.cargo:
        executable: "{{ user.home }}/.cargo/bin/cargo"
        name: "{{ item.item.name }}"
      with_items: "{{ check_cargo_status.results }}"
  become_user: "{{ user.name }}"
  become: yes

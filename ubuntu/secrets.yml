---
- name: Initialize GnuPG and Password Store
  hosts: localhost
  connection: local
  gather_facts: yes
  become: yes # Apply privilege escalation to the whole play

  vars_prompt:
    - name: gpg_name
      prompt: "Enter your full name for the GPG key"
      private: no
    - name: gpg_email
      prompt: "Enter your email for the GPG key"
      private: no
    - name: gpg_passphrase
      prompt: "Enter the passphrase for your new GPG key"
      private: yes

  tasks:
    - name: 1. Ensure required packages are installed (for Debian/Ubuntu)
      ansible.builtin.apt:
        name:
          - gnupg2
          - pass
          - rng-tools
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: 2. Ensure entropy service is running for key generation
      ansible.builtin.service:
        name: rng-tools
        state: started
        enabled: yes
      when: ansible_os_family == "Debian"
      ignore_errors: yes

    # The following tasks will be run as the regular user
    # 'become: no' ensures we are not running as root
    - name: 3. GPG and Pass setup
      become: no
      block:
        - name: Check if GPG key already exists for the email
          ansible.builtin.shell: "gpg --list-secret-keys '{{ gpg_email }}'"
          register: gpg_key_check
          changed_when: false
          failed_when: false

        - name: Generate GPG key if it does not exist
          when: gpg_key_check.rc != 0
          block:
            - name: Create GPG key generation parameter file
              ansible.builtin.template:
                src: templates/gpg_batch.j2
                dest: /tmp/gpg_batch_params
                mode: '0600'

            - name: Generate GPG key using the batch file
              ansible.builtin.shell: "gpg --batch --gen-key /tmp/gpg_batch_params"
              changed_when: true

            - name: Clean up GPG batch file
              ansible.builtin.file:
                path: /tmp/gpg_batch_params
                state: absent

        - name: Get the GPG key ID
          ansible.builtin.shell: >
            set -o pipefail &&
            gpg --list-secret-keys --with-colons '{{ gpg_email }}' |
            awk -F: '/^sec/{print $5}'
          args:
            executable: /bin/bash
          register: gpg_key_id_result
          changed_when: false

        - name: Create project directory if it does not exist
          ansible.builtin.file:
            path: "/home/tuomo/project"
            state: directory
            mode: '0755'

        - name: Check if password store already exists
          ansible.builtin.stat:
            path: "/home/tuomo/project/.password-store"
          register: pass_store_stat

        - name: Initialize password store in ~/project
          ansible.builtin.command: "pass init --path /home/tuomo/project/.password-store {{ gpg_key_id_result.stdout }}"
          when: not pass_store_stat.stat.exists
          changed_when: true

        - name: Display final instructions
          ansible.builtin.debug:
            msg: |
              ✅ SUCCESS! Your password store is ready in ~/project/.password-store.
              To use it, you MUST set the PASSWORD_STORE_DIR environment variable.
              Add the following line to your ~/.bashrc or ~/.zshrc file:

              export PASSWORD_STORE_DIR=/home/tuomo/project/.password-store

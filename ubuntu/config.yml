username: tuomo
dotfiles_repo_url: https://github.com/syvanpera/dotfiles.git
folders:
  home:
    - .config

packages:
  - gcc
  - golang
  - neovim
  - nodejs
  - npm
  - stow
  - tmux
  - unzip

oh-my-zsh:
  plugins:
    - { name: "zsh-autosuggestions", repo: "https://github.com/zsh-users/zsh-autosuggestions" }
    - { name: "zsh-syntax-highlighting", repo: "https://github.com/zsh-users/zsh-syntax-highlighting" }
  themes:
    - { name: "powerlevel10k", repo: "https://github.com/romkatv/powerlevel10k" }

dotfiles:
  repo:
    url: https://github.com/syvanpera/dotfiles.git
    branch: devbox

apt_repositories:
  - ppa:neovim-ppa/unstable

packages:
  - bat
  - curl
  - direnv
  - eza
  - gcc
  - golang
  - neovim
  - nodejs
  - npm
  - unzip
  - ripgrep
  - stow
  - tig
  - tmux
  - zsh

rust_packages:
  - name: yazi-fm
    binary: yazi
  - name: yazi-cli
    binary: yazi
  - name: procs
    binary: procs
  - name: fd-find
    binary: fd
  - name: git-delta
    binary: delta

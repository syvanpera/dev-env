username: tuomo
dotfiles_repo_url: https://github.com/syvanpera/dotfiles.git
folders:
  home:
    - .config
    - .config/systemd/user
    - .local/bin

shell:
  aliases:
    vi: nvim
    l:  eza --color=always --long --group-directories-first --git --no-filesize --icons=always --no-time --no-user --no-permissions
    ll: eza -l --group --color=always --group-directories-first --time-style=long-iso --icons --git
    ls: eza --group --color=always --group-directories-first --time-style=long-iso --icons
    cat: batcat

apt_repositories:
  - ppa:neovim-ppa/unstable

packages:
  - bat
  - direnv
  - eza
  - gcc
  - golang
  - jq
  - neovim
  - nodejs
  - npm
  - pass
  - pipx
  - ripgrep
  - stow
  - tig
  - tmux
  - unzip
  - zsh

python_packages:
  - black
  - tmuxp

rust_packages:
  - name: yazi-fm
    binary: yazi
  - name: yazi-cli
    binary: yazi
  - name: procs
    binary: procs
  - name: fd-find
    binary: fd
  - name: git-delta
    binary: delta

ohmyzsh:
  plugins:
    - name: "zsh-autosuggestions"
      repo: "https://github.com/zsh-users/zsh-autosuggestions"
    - name: "zsh-syntax-highlighting"
      repo: "https://github.com/zsh-users/zsh-syntax-highlighting"
  themes:
    - name: "powerlevel10k"
      repo: "https://github.com/romkatv/powerlevel10k"

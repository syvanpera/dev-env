- user:
    name: "{{ username }}"
    state: present
  register: user
- name: Create home folders
  become: yes
  become_user: "{{ user.name }}"
  file:
    path: "{{ user.home }}/{{ item }}"
    state: directory
  loop: "{{ folders.home }}"
- name: Create project directory symlink
  become: yes
  become_user: "{{ user.name }}"
  file:
    src: "/mnt/project"
    dest: "{{ user.home }}/project"
    state: link

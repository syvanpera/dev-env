---
- name: Bootstrap development environment
  hosts: 127.0.0.1
  connection: local

  vars_prompt:
    - name: fullname
      prompt: "Enter your full name"
      private: no
    - name: username
      prompt: "Enter your username"
      private: no
    - name: email
      prompt: "Enter your email"
      private: no
    - name: passphrase
      prompt: "Enter the passphrase for your new GPG key"
      private: yes
    - name: passphrase_confirm
      prompt: "Confirm the passphrase"
      private: yes

  tasks:
    - name: Verify that GPG passphrases match
      ansible.builtin.fail:
        msg: "❌ ERROR: The passphrases you entered do not match. Please run the playbook again."
      when: passphrase != passphrase_confirm
      become: no
    - include_vars: "config.yml"
    - include_tasks: "user.yml"
    - include_tasks: "ubuntu/bootstrap.yml"
    - include_tasks: "project.yml"
      when: ansible_distribution == "Ubuntu"

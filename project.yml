- block:
    - name: Initialize project directory and GnuPG and Password Store
      block:
        - name: Check if GPG key already exists for the email
          ansible.builtin.shell: "gpg --list-secret-keys '{{ gpg_email }}'"
          register: gpg_key_check
          changed_when: false
          failed_when: false

        - name: Generate GPG key if it does not exist
          when: gpg_key_check.rc != 0
          block:
            - name: Create GPG key generation parameter file
              ansible.builtin.template:
                src: templates/gpg_batch.j2
                dest: /tmp/gpg_batch_params
                mode: '0600'

            - name: Generate GPG key using the batch file
              ansible.builtin.shell: "gpg --batch --gen-key /tmp/gpg_batch_params"
              changed_when: true

            - name: Clean up GPG batch file
              ansible.builtin.file:
                path: /tmp/gpg_batch_params
                state: absent

        - name: Get the GPG key ID
          ansible.builtin.shell: >
            set -o pipefail &&
            gpg --list-secret-keys --with-colons '{{ gpg_email }}' |
            awk -F: '/^sec/{print $5}'
          args:
            executable: /bin/bash
          register: gpg_key_id_result
          changed_when: false

        - name: Create project directory if it does not exist
          ansible.builtin.file:
            path: "{{ user.home }}/project"
            state: directory
            mode: '0755'

        - name: Check if password store already exists
          ansible.builtin.stat:
            path: "{{ user.home }}/project/.password-store"
          register: pass_store_stat

        - name: Initialize password store in project directory
          ansible.builtin.command: "pass init {{ gpg_key_id_result.stdout }}"
          environment:
            PASSWORD_STORE_DIR: "{{ user.home }}/project/.password-store"
          when: not pass_store_stat.stat.exists
          changed_when: true

        - name: Create .envrc file for direnv
          ansible.builtin.copy:
            dest: "{{ user.home }}/project/.envrc"
            content: |
              export PROJECT={{ project }}
              export PROJECT_DIR=$(pwd)
              export PASSWORD_STORE_DIR=$PROJECT_DIR/.password-store
            mode: '0644'

        - name: Display final instructions
          ansible.builtin.debug:
            msg: |
              ✅ SUCCESS! Your password store is ready in ~/project/.password-store.
              To use it, you MUST set the PASSWORD_STORE_DIR environment variable.
              Add the following line to your ~/.bashrc or ~/.zshrc file:

              export PASSWORD_STORE_DIR={{ user.home }}/project/.password-store
  become_user: "{{ user.name }}"
  become: yes
